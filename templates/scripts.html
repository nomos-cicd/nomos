{% extends "fragment-base.html" %}

{% block body %}
<div class="uk-container uk-container-lg my-4">
    <div class="uk-card">
        <div class="uk-overflow-auto">
            <table class="uk-table uk-table-middle uk-table-divider uk-table-hover">
                <thead>
                    <tr>
                        <th style="width: 10%">ID</th>
                        <th>Name</th>
                        <th>Parameters</th>
                        <th>Steps</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for script in scripts %}
                    <tr>
                        <td>{{ script.id }}</td>
                        <td>{{ script.name }}</td>
                        <td>{{ script.parameters.len() }}</td>
                        <td>{{ script.steps.len() }}</td>
                        <td>
                            <a href="/scripts/{{ script.id }}" class="uk-btn uk-btn-default uk-btn-sm">
                                View
                            </a>
                            <a href="/jobs/create?from-script-id={{ script.id }}"
                                class="uk-btn uk-btn-primary uk-btn-sm">
                                Create job
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
