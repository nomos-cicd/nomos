{% for log in logs %}
<div class="mb-2">
    <span class="text-sm text-muted-foreground">{{ log.timestamp.format("%Y-%m-%d %H:%M:%S") }}</span>
    <span class="uk-label uk-label-sm
        {% match log.level %}
        {% when LogLevel::Info %}uk-label-primary
        {% when LogLevel::Warning %}uk-label-warning
        {% when LogLevel::Error %}uk-label-destructive
        {% endmatch %}">
        {{ log.level }}
    </span>
    <pre class="mt-1 mb-0 text-sm"
        style="display: contents;">{{ log.message }}</pre>
</div>
{% endfor %}
