<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <style>
        :root {
            font-family: Inter, sans-serif;
            font-feature-settings: "liga" 1, "calt" 1;
        }

        @supports (font-variation-settings: normal) {
            :root {
                font-family: InterVariable, sans-serif;
            }
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.0/dist/css/core.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@2.1.0/dist/css/utilities.min.css" />
    <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css" />

    <script>
        (() => {
            const htmlElement = document.documentElement;
            const frankenSettings = JSON.parse(localStorage.getItem("__FRANKEN__") || "{}");

            // Dark mode
            const preferredMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            const mode = frankenSettings.mode || preferredMode;
            htmlElement.classList.add("dark");

            // Apply theme and other settings from localStorage
            htmlElement.classList.add(frankenSettings.theme || "uk-theme-emerald");
            htmlElement.classList.add(frankenSettings.radii || "uk-radii-md");
            htmlElement.classList.add(frankenSettings.shadows || "uk-shadows-sm");
            htmlElement.classList.add(frankenSettings.font || "uk-font-sm");
            htmlElement.classList.add(frankenSettings.chart || "uk-chart-default");
        })();
    </script>

    <script type="module" src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.0/dist/js/core.iife.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/franken-ui@2.1.0/dist/js/icon.iife.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.js"></script>
    <script>var require = { paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } };</script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.js"></script>
</head>

<body class="bg-background text-foreground">
    <!-- Navbar reimplemented with flex and Drop component -->
    <div data-uk-sticky="show-on-up: true" class="border-b bg-background/80 backdrop-blur">
        <nav class="uk-container flex h-16 items-center">
            <div class="flex items-center gap-x-4">
                <ul class="uk-nav uk-nav-default flex items-center gap-x-4">
                    <li class='{% if title == "Job Results" %}uk-active{% endif %}'>
                        <a href="/job-results">Job Results</a>
                    </li>
                    <li>
                        <a href="#" class='{% if title == "Jobs" || title == "Create Job" %}uk-active{% endif %}'>
                            Jobs <span data-uk-icon="icon: chevron-down; ratio: .8"></span>
                        </a>
                        <div class="uk-navbar-dropdown">
                            <ul class="uk-nav uk-navbar-dropdown-nav">
                                <li class='{% if title == "Jobs" %}uk-active{% endif %}'>
                                    <a href="/jobs">List Jobs</a>
                                </li>
                                <li class='{% if title == "Create Job" %}uk-active{% endif %}'>
                                    <a href="/jobs/create">Create Job</a>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li>
                        <a href="#"
                            class='{% if title == "Credentials" || title == "Create Credential" %}uk-active{% endif %}'>
                            Credentials <span data-uk-icon="icon: chevron-down; ratio: .8"></span>
                        </a>
                        <div class="uk-navbar-dropdown">
                            <ul class="uk-nav uk-navbar-dropdown-nav">
                                <li class='{% if title == "Credentials" %}uk-active{% endif %}'>
                                    <a href="/credentials">List Credentials</a>
                                </li>
                                <li class='{% if title == "Create Credential" %}uk-active{% endif %}'>
                                    <a href="/credentials/create">Create Credential</a>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li>
                        <a href="#" class='{% if title == "Scripts" || title == "Create Script" %}uk-active{% endif %}'>
                            Scripts <span data-uk-icon="icon: chevron-down; ratio: .8"></span>
                        </a>
                        <div class="uk-navbar-dropdown">
                            <ul class="uk-nav uk-navbar-dropdown-nav">
                                <li class='{% if title == "Scripts" %}uk-active{% endif %}'>
                                    <a href="/scripts">List Scripts</a>
                                </li>
                                <li class='{% if title == "Create Script" %}uk-active{% endif %}'>
                                    <a href="/scripts/create">Create Script</a>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="mt-4">
        {% block body %}{% endblock %}
    </div>

    <script>
        // Returns JSON elements from form data. Checks if dot notation is used in the name attribute.
        // E.g. { "name": "John Doe", "address": { "street": "123 Main St", "city": "Springfield" } }
        function getFormData(form) {
            const json = {};
            for (const [key, value] of getFormEntries(form)) {
                const keys = key.split(".");
                let ref = json;
                for (let i = 0; i < keys.length; i++) {
                    if (i === keys.length - 1) {
                        ref[keys[i]] = value;
                    } else {
                        ref = ref[keys[i]] = ref[keys[i]] || {};
                    }
                }
            }
            return json;
        }

        function getFormEntries(form) {
            const entries = [];
            form.querySelectorAll("input, select, textarea, uk-select").forEach((input) => {
                if (input.type === "checkbox") {
                    entries.push([input.name, input.checked]);
                } else {
                    entries.push([input.name, input.value]);
                }
            });
            return entries;
        }

        function submitForm(event) {
            submitString(event, getFormData(event.target));
        }

        async function submitString(event, cssSelector, contentType = "application/json") {
            event.preventDefault();
            let content = null;
            if (typeof cssSelector === "string") {
                const element = document.querySelector(cssSelector);
                content = element ? element.value : null;
            } else {
                content = cssSelector;
            }
            if (!content) {
                console.error("No content to submit.");
                return;
            }

            const response = await fetch(event.target.action, {
                method: event.target.method,
                headers: {
                    "Content-Type": contentType,
                },
                body: contentType === "application/json" ? JSON.stringify(content) : content,
            });
            const data = await response.text();
            console.log(data);
            if (response.ok) {
                alert("Success");
            } else {
                alert(`Error: ${data}`);
            }
        }
    </script>
</body>

</html>
